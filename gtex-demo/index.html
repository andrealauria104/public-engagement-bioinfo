<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GTEx Explorer — Gene Expression Across Tissues</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js" crossorigin></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" crossorigin></script>

<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-border: #262b38;
    --text: #e7e9ee;
    --text-dim: #9aa1b1;
    --accent: #7c9eff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #root { min-height: 100vh; }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid var(--panel-border);
  }
  .header h1 {
    margin: 0 0 6px;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .header .pedagogy {
    color: var(--text-dim);
    font-size: 14px;
    max-width: 820px;
    line-height: 1.5;
  }

  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr 300px;
    gap: 16px;
    padding: 16px 24px 24px;
  }
  @media (max-width: 980px) {
    .main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
  }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  /* Gene picker */
  .search-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #0f1117;
    color: var(--text);
    font-size: 14px;
  }
  .search-input:focus { outline: 2px solid var(--accent); }
  .search-results {
    margin-top: 8px;
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .search-result {
    text-align: left;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  .search-result:hover { background: #1f2330; border-color: var(--panel-border); }
  .search-result .sym { font-weight: 600; }
  .search-result .name { color: var(--text-dim); margin-left: 6px; }

  .badge-row { margin-top: 14px; }
  .gene-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: linear-gradient(135deg, #3b82f6, #ef4444);
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: grab;
    user-select: none;
  }
  .gene-badge:active { cursor: grabbing; }
  .hint { margin-top: 8px; font-size: 12px; color: var(--text-dim); }

  /* Tissue drop zones */
  .tissue-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .tissue-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    font-size: 13px;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .tissue-chip .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .tissue-chip.dragover {
    transform: scale(1.03);
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(124,158,255,0.35);
  }

  .reset-btn {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: #1f2330;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  .reset-btn:hover { background: #262b38; }

  /* Plot panel */
  .plot-panel { display: flex; flex-direction: column; min-height: 520px; }
  #umap-plot { flex: 1; width: 100%; min-height: 480px; }

  .toast {
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 8px;
    background: #1c2333;
    border: 1px solid var(--accent);
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .toast button {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px;
  }

  /* Gene card */
  .gene-card h3 { margin: 0; font-size: 18px; }
  .gene-card .full-name { color: var(--text-dim); font-size: 13px; margin: 2px 0 12px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--panel-border); }
  .stat-row span:first-child { color: var(--text-dim); }
  .bar-row { margin-top: 10px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 2px; }
  .bar-track { height: 8px; border-radius: 4px; background: #0f1117; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .empty-state { color: var(--text-dim); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // ---- Synthetic GTEx-like data generator (deterministic, seeded) ----
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gaussian(rng) {
    var u = 1 - rng(), v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function generateGtexData() {
    var rng = mulberry32(42);

    var tissues = [
      { name: "Liver",    color: "#FF6B6B", markers: [["ALB","Albumin"],["APOB","Apolipoprotein B"],["CYP3A4","Cytochrome P450 3A4"],["TTR","Transthyretin"],["SERPINA1","Alpha-1 Antitrypsin"]] },
      { name: "Brain",    color: "#4ECDC4", markers: [["GFAP","Glial Fibrillary Acidic Protein"],["SNAP25","Synaptosome Assoc. Protein 25"],["MBP","Myelin Basic Protein"],["SYT1","Synaptotagmin 1"],["RBFOX3","RNA Binding Fox-1 Homolog 3"]] },
      { name: "Heart",    color: "#45B7D1", markers: [["MYH6","Myosin Heavy Chain 6"],["TNNT2","Troponin T2, Cardiac"],["NPPA","Natriuretic Peptide A"],["ACTC1","Actin, Cardiac Muscle 1"],["MYL2","Myosin Light Chain 2"]] },
      { name: "Kidney",   color: "#96CEB4", markers: [["UMOD","Uromodulin"],["AQP2","Aquaporin 2"],["SLC12A1","Na-K-Cl Cotransporter"],["NPHS2","Podocin"],["CUBN","Cubilin"]] },
      { name: "Lung",     color: "#FFEAA7", markers: [["SFTPC","Surfactant Protein C"],["SFTPB","Surfactant Protein B"],["SCGB1A1","Secretoglobin 1A1"],["NAPSA","Napsin A"],["AGER","Advanced Glycosylation End-Product Receptor"]] },
      { name: "Pancreas", color: "#DDA15E", markers: [["INS","Insulin"],["GCG","Glucagon"],["PRSS1","Trypsinogen"],["AMY2A","Pancreatic Amylase"],["SST","Somatostatin"]] },
      { name: "Muscle",   color: "#BC6C25", markers: [["ACTA1","Actin, Skeletal Muscle"],["MYH1","Myosin Heavy Chain 1"],["TTN","Titin"],["CKM","Creatine Kinase, Muscle"],["DES","Desmin"]] },
      { name: "Adipose",  color: "#D8B4B8", markers: [["ADIPOQ","Adiponectin"],["LEP","Leptin"],["FABP4","Fatty Acid Binding Protein 4"],["PLIN1","Perilipin 1"],["UCP1","Uncoupling Protein 1"]] },
      { name: "Blood",    color: "#C084FC", markers: [["HBB","Hemoglobin Beta"],["HBA1","Hemoglobin Alpha 1"],["GYPA","Glycophorin A"],["CD3D","CD3d Molecule"],["CD19","CD19 Molecule"]] },
      { name: "Thyroid",  color: "#A78BFA", markers: [["TG","Thyroglobulin"],["TPO","Thyroid Peroxidase"],["TSHR","Thyroid Stimulating Hormone Receptor"],["SLC5A5","Sodium/Iodide Cotransporter"],["PAX8","Paired Box 8"]] }
    ];

    var samplesPerTissue = 80;
    var blobRadius = 8;
    var blobSpread = 1.15;

    var samples = [];
    var tissueColors = {};
    tissues.forEach(function (t, ti) {
      tissueColors[t.name] = t.color;
      var angle = (2 * Math.PI * ti) / tissues.length;
      var cx = blobRadius * Math.cos(angle);
      var cy = blobRadius * Math.sin(angle);
      for (var i = 0; i < samplesPerTissue; i++) {
        samples.push({
          id: "GTEX-" + t.name.slice(0, 3).toUpperCase() + "-" + String(i + 1).padStart(3, "0"),
          tissue: t.name,
          x: cx + gaussian(rng) * blobSpread,
          y: cy + gaussian(rng) * blobSpread
        });
      }
    });

    var genes = [];
    tissues.forEach(function (t) {
      t.markers.forEach(function (m) {
        var symbol = m[0], name = m[1];
        var data = samples.map(function (s) {
          var base = s.tissue === t.name ? 9.2 : 0.6;
          var noise = gaussian(rng) * (s.tissue === t.name ? 0.9 : 0.4);
          return clamp(base + noise, 0, 12);
        });
        genes.push({ symbol: symbol, name: name, data: data });
      });
    });

    return { samples: samples, genes: genes, tissueColors: tissueColors, tissueOrder: tissues.map(function(t){return t.name;}) };
  }

  window.GTEX_DATA = generateGtexData();
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect, useCallback } = React;
const DATA = window.GTEX_DATA;

function meanMinMax(arr) {
  let min = Infinity, max = -Infinity, sum = 0;
  for (const v of arr) { if (v < min) min = v; if (v > max) max = v; sum += v; }
  return { min, max, mean: sum / arr.length };
}

function meanByTissue(gene, samples, tissueOrder) {
  const sums = {}, counts = {};
  tissueOrder.forEach(t => { sums[t] = 0; counts[t] = 0; });
  samples.forEach((s, i) => { sums[s.tissue] += gene.data[i]; counts[s.tissue]++; });
  return tissueOrder.map(t => ({ tissue: t, mean: sums[t] / counts[t] }));
}

function GenePicker({ genes, onSelect, selectedGene, onDragStart }) {
  const [query, setQuery] = useState("");
  const fuse = useMemo(() => new Fuse(genes, { keys: ["symbol", "name"], threshold: 0.35 }), [genes]);
  const results = useMemo(() => {
    if (!query.trim()) return [];
    return fuse.search(query).slice(0, 8).map(r => r.item);
  }, [query, fuse]);

  return (
    <div className="panel">
      <h2>Gene Search</h2>
      <input
        className="search-input"
        placeholder="Search a marker gene (e.g. ALB, INS, MYH6)..."
        value={query}
        onChange={e => setQuery(e.target.value)}
      />
      {results.length > 0 && (
        <div className="search-results">
          {results.map(g => (
            <button
              key={g.symbol}
              className="search-result"
              onClick={() => { onSelect(g); setQuery(""); }}
            >
              <span className="sym">{g.symbol}</span>
              <span className="name">{g.name}</span>
            </button>
          ))}
        </div>
      )}

      <div className="badge-row">
        {selectedGene ? (
          <>
            <span
              className="gene-badge"
              draggable
              onDragStart={e => { e.dataTransfer.setData("text/plain", selectedGene.symbol); onDragStart(selectedGene); }}
            >
              {selectedGene.symbol}
            </span>
            <div className="hint">Drag this badge onto a tissue on the right to see how much it's "turned on" there.</div>
          </>
        ) : (
          <div className="hint">Select a gene to color the plot by expression and enable drag-and-drop.</div>
        )}
      </div>
    </div>
  );
}

function TissueDropZones({ tissueOrder, tissueColors, hoveredTissue, onDragOverTissue, onDragLeaveTissue, onDropTissue, draggingGene }) {
  return (
    <div className="panel">
      <h2>Tissue Clusters</h2>
      <div className="tissue-list">
        {tissueOrder.map(t => (
          <div
            key={t}
            className={"tissue-chip" + (hoveredTissue === t ? " dragover" : "")}
            onDragOver={e => { e.preventDefault(); onDragOverTissue(t); }}
            onDragLeave={() => onDragLeaveTissue(t)}
            onDrop={e => { e.preventDefault(); onDropTissue(t); }}
          >
            <span className="dot" style={{ background: tissueColors[t] }} />
            {t}
          </div>
        ))}
      </div>
      {!draggingGene && <div className="hint">Drop targets activate once a gene is selected and dragged.</div>}
    </div>
  );
}

function UmapPlot({ samples, tissueOrder, tissueColors, selectedGene, highlightedTissue }) {
  const ref = useRef(null);

  useEffect(() => {
    const div = ref.current;
    let traces;

    if (!selectedGene) {
      traces = tissueOrder.map(t => {
        const pts = samples.map((s, i) => ({ s, i })).filter(o => o.s.tissue === t);
        const isHighlighted = highlightedTissue === t;
        return {
          type: "scattergl",
          mode: "markers",
          name: t,
          x: pts.map(o => o.s.x),
          y: pts.map(o => o.s.y),
          text: pts.map(o => o.s.id + "<br>" + o.s.tissue),
          hoverinfo: "text",
          marker: {
            color: tissueColors[t],
            size: isHighlighted ? 10 : 6,
            opacity: highlightedTissue && !isHighlighted ? 0.25 : 0.85,
            line: isHighlighted ? { color: "#fff", width: 1 } : undefined
          }
        };
      });
    } else {
      traces = [{
        type: "scattergl",
        mode: "markers",
        name: selectedGene.symbol,
        x: samples.map(s => s.x),
        y: samples.map(s => s.y),
        text: samples.map((s, i) =>
          s.id + "<br>" + s.tissue + "<br>" + selectedGene.symbol + ": " + selectedGene.data[i].toFixed(2)
        ),
        hoverinfo: "text",
        marker: {
          color: selectedGene.data,
          colorscale: [[0, "#3b82f6"], [0.5, "#c084fc"], [1, "#ef4444"]],
          cmin: 0,
          cmax: 12,
          size: samples.map(s => (highlightedTissue && s.tissue === highlightedTissue ? 10 : 6)),
          opacity: samples.map(s => (highlightedTissue ? (s.tissue === highlightedTissue ? 0.95 : 0.25) : 0.85)),
          colorbar: { title: "log2(CPM+1)", thickness: 14 },
          showscale: true
        }
      }];
    }

    const layout = {
      autosize: true,
      showlegend: !selectedGene,
      legend: { orientation: "h", y: -0.15, font: { color: "#e7e9ee", size: 11 } },
      margin: { l: 30, r: 20, t: 10, b: 30 },
      paper_bgcolor: "#171a23",
      plot_bgcolor: "#171a23",
      xaxis: { title: "UMAP-1", color: "#9aa1b1", gridcolor: "#262b38", zeroline: false },
      yaxis: { title: "UMAP-2", color: "#9aa1b1", gridcolor: "#262b38", zeroline: false },
      font: { color: "#e7e9ee" }
    };

    Plotly.react(div, traces, layout, { responsive: true, displayModeBar: false });
  }, [samples, tissueOrder, tissueColors, selectedGene, highlightedTissue]);

  useEffect(() => {
    const handleResize = () => { if (ref.current) Plotly.Plots.resize(ref.current); };
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, []);

  return <div id="umap-plot" ref={ref} />;
}

function GeneCard({ gene, samples, tissueOrder, tissueColors }) {
  if (!gene) {
    return (
      <div className="panel gene-card">
        <h2>Gene Details</h2>
        <div className="empty-state">
          Gene expression varies by tissue. Each point on the plot is a sample; color shows how much a gene
          is expressed. Search for a gene, then drag it onto a tissue cluster to see: "This gene is highly
          expressed in Liver but not in Brain."
        </div>
      </div>
    );
  }

  const stats = meanMinMax(gene.data);
  const byTissue = meanByTissue(gene, samples, tissueOrder).sort((a, b) => b.mean - a.mean);
  const maxMean = byTissue[0].mean;

  return (
    <div className="panel gene-card">
      <h2>Gene Details</h2>
      <h3>{gene.symbol}</h3>
      <p className="full-name">{gene.name}</p>

      <div className="stat-row"><span>Min</span><span>{stats.min.toFixed(2)}</span></div>
      <div className="stat-row"><span>Mean</span><span>{stats.mean.toFixed(2)}</span></div>
      <div className="stat-row"><span>Max</span><span>{stats.max.toFixed(2)}</span></div>

      {byTissue.map(({ tissue, mean }) => (
        <div className="bar-row" key={tissue}>
          <div className="bar-label">
            <span>{tissue}</span>
            <span>{mean.toFixed(2)}</span>
          </div>
          <div className="bar-track">
            <div
              className="bar-fill"
              style={{ width: (mean / maxMean * 100) + "%", background: tissueColors[tissue] }}
            />
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const { samples, genes, tissueColors, tissueOrder } = DATA;

  const [selectedGene, setSelectedGene] = useState(null);
  const [draggingGene, setDraggingGene] = useState(null);
  const [hoveredTissue, setHoveredTissue] = useState(null);
  const [highlightedTissue, setHighlightedTissue] = useState(null);
  const [toast, setToast] = useState(null);

  const onGeneSelected = useCallback((gene) => {
    setSelectedGene(gene);
    setHighlightedTissue(null);
    setToast(null);
  }, []);

  const onDragStart = useCallback((gene) => setDraggingGene(gene), []);

  const onDragOverTissue = useCallback((tissue) => setHoveredTissue(tissue), []);
  const onDragLeaveTissue = useCallback((tissue) => {
    setHoveredTissue(prev => (prev === tissue ? null : prev));
  }, []);

  const onDropTissue = useCallback((tissue) => {
    if (!selectedGene) return;
    const { mean } = (() => {
      const arr = meanByTissue(selectedGene, samples, tissueOrder).find(x => x.tissue === tissue);
      return { mean: arr.mean };
    })();
    setHighlightedTissue(tissue);
    setHoveredTissue(null);
    setDraggingGene(null);
    setToast(`${selectedGene.symbol} is expressed at mean ${mean.toFixed(2)} (log2 CPM+1) in ${tissue}.`);
  }, [selectedGene, samples, tissueOrder]);

  const onReset = useCallback(() => {
    setSelectedGene(null);
    setHighlightedTissue(null);
    setHoveredTissue(null);
    setDraggingGene(null);
    setToast(null);
  }, []);

  return (
    <div className="app">
      <div className="header">
        <h1>GTEx Explorer — Gene Expression Across Tissues</h1>
        <div className="pedagogy">
          Gene expression varies by tissue. Each point is a sample; color shows how much a gene is
          expressed. Drag a gene onto a cluster to see how much it's "turned on" in that tissue.
        </div>
      </div>

      <div className="main">
        <GenePicker
          genes={genes}
          onSelect={onGeneSelected}
          selectedGene={selectedGene}
          onDragStart={onDragStart}
        />

        <div className="panel plot-panel">
          <h2>Tissue UMAP{selectedGene ? " — colored by " + selectedGene.symbol + " expression" : " — colored by tissue"}</h2>
          <UmapPlot
            samples={samples}
            tissueOrder={tissueOrder}
            tissueColors={tissueColors}
            selectedGene={selectedGene}
            highlightedTissue={highlightedTissue}
          />
          {toast && (
            <div className="toast">
              <span>{toast}</span>
              <button onClick={() => setToast(null)}>✕</button>
            </div>
          )}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: "16px" }}>
          <TissueDropZones
            tissueOrder={tissueOrder}
            tissueColors={tissueColors}
            hoveredTissue={hoveredTissue}
            onDragOverTissue={onDragOverTissue}
            onDragLeaveTissue={onDragLeaveTissue}
            onDropTissue={onDropTissue}
            draggingGene={draggingGene}
          />
          <GeneCard gene={selectedGene} samples={samples} tissueOrder={tissueOrder} tissueColors={tissueColors} />
          <button className="reset-btn" onClick={onReset}>Reset</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
