<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Engagement Bioinfo</title>
    <!-- Landing page served at the site root. Add one .app card per project. -->
    <style>
      :root {
        /* palette matches gtex-game/src/styles/tokens.css */
        --paper: #f5f9fc;
        --panel: #ffffff;
        --panel-border: #d8e4ee;
        --ink: #1e2733;
        --ink-dim: #57626e;
        --probe-blue: #0072b2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 48px 16px;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }

      .intro {
        margin: 0 0 32px;
        color: var(--ink-dim);
        font-size: 17px;
        line-height: 1.5;
      }

      .app {
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(30, 39, 51, 0.08);
      }

      .app + .app {
        margin-top: 16px;
      }

      .app h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .app p {
        margin: 0 0 20px;
        color: var(--ink-dim);
        line-height: 1.5;
      }

      .button {
        display: inline-block;
        padding: 12px 20px;
        background: var(--probe-blue);
        color: #fff;
        border-radius: 10px;
        font-weight: bold;
        text-decoration: none;
      }

      .button:hover,
      .button:focus-visible {
        background: #005a8c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Public Engagement Bioinfo</h1>
      <p class="intro">
        Interactive tools that make bioinformatics data tangible for everyone.
      </p>

      <section class="app">
        <h2>Signal Match</h2>
        <p>
          Match genes to the tissue they are expressed in, using real GTEx
          gene expression data.
        </p>
        <a class="button" href="gtex-game/">Open Signal Match</a>
      </section>
    </main>
  </body>
</html>
